<!--{% extends 'base.html' %}

{% block title %}Gerenciamento de Produtos{% endblock %}

{% block page_title %}
    <i class="fas fa-briefcase"></i> Área do Empresário
{% endblock %}

{% block content %}
<div class="top-bar">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchProduct" placeholder="Pesquisar produto..." oninput="filterProducts()">
    </div>
    <div class="filter-group">
        <label for="adicional-filter">Disponibilidade:</label>
        <select id="adicional-filter" onchange="filterProducts()">
            <option value="">Todos</option>
            <option value="disponivel">Disponível</option>
            <option value="nao_disponivel">Não Disponível</option>
        </select>
    </div>
</div>

<div id="noResultsMessage" class="empty-state" style="display: none;">
    <i class="fas fa-search"></i>
    <h3>Nenhum produto encontrado</h3>
    <p>Tente ajustar os filtros de busca</p>
</div>

{% if produtos %}
<div class="cards-container">
    {% for produto in produtos %}
    <div class="product-card" data-adicional="{{ produto.adicional|lower }}">
        <div class="card-header">
            <h3>{{ produto.nome }}</h3>
            <div class="status-badge 
                {% if produto.adicional|lower == 'disponivel' %}available
                {% elif produto.adicional|lower == 'nao_disponivel' %}unavailable
                {% else %}unknown
                {% endif %}
            ">
                {% if produto.adicional|lower == 'disponivel' %}
                    Disponível
                {% elif produto.adicional|lower == 'nao_disponivel' %}
                    Não Disponível
                {% else %}
                    {{ produto.adicional }}
                {% endif %}
            </div>
        </div>
        <p class="categories">
            {% for categoria in produto.categorias.all %}
                {{ categoria.nome }}{% if not forloop.last %}, {% endif %}
            {% empty %}
                Sem categoria
            {% endfor %}
        </p>
        <p class="price">R$ {{ produto.valor }}</p>
        <div class="actions">
            <a href="{% url 'produto_update' produto.id %}" class="action-btn edit-btn" title="Editar">
                <i class="fas fa-edit"></i>
            </a>
            <a href="{% url 'produto_delete' produto.id %}" class="action-btn delete-btn" title="Excluir">
                <i class="fas fa-trash"></i>
            </a>
        </div>
    </div>
    {% endfor %}
</div>

<div class="pagination">
    {% if produtos.has_previous %}
        <a href="?page={{ produtos.previous_page_number }}" class="pagination-arrow" title="Anterior">
            <i class="fas fa-chevron-left"></i>
        </a>
    {% else %}
        <span class="pagination-arrow disabled"><i class="fas fa-chevron-left"></i></span>
    {% endif %}

    <span class="current-page">Página {{ produtos.number }} de {{ produtos.paginator.num_pages }}</span>

    {% if produtos.has_next %}
        <a href="?page={{ produtos.next_page_number }}" class="pagination-arrow" title="Próxima">
            <i class="fas fa-chevron-right"></i>
        </a>
    {% else %}
        <span class="pagination-arrow disabled"><i class="fas fa-chevron-right"></i></span>
    {% endif %}
</div>
{% else %}
<div class="empty-state">
    <i class="fas fa-box-open"></i>
    <h3>Nenhum produto cadastrado</h3>
</div>
{% endif %}

<style>
:root {
    --cor-primaria: #fcd3d3;
    --cor-secundaria: #c1e6d0;
    --cor-destaque: #f87171;
    --cor-verde-hover: #a4d4b4;
    --texto-escuro: #333;
    --texto-claro: #666;
    --bg-cards: #fff;
    --shadow-card: rgba(0,0,0,0.1);
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 1rem;
}

.search-box {
    position: relative;
    flex-grow: 1;
    max-width: 300px;
}

.search-box input {
    width: 100%;
    padding: 0.5rem 2.5rem 0.5rem 2.5rem;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 1rem;
    box-shadow: 0 2px 5px var(--shadow-card);
    transition: border-color 0.3s ease;
}

.search-box input:focus {
    outline: none;
    border-color: var(--cor-secundaria);
}

.search-box i {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--texto-claro);
    font-size: 1.2rem;
}

.filter-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.filter-group label {
    font-weight: 600;
    color: var(--texto-escuro);
}

.filter-group select {
    padding: 0.4rem 0.6rem;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 1rem;
    box-shadow: 0 2px 5px var(--shadow-card);
    transition: border-color 0.3s ease;
}

.filter-group select:hover,
.filter-group select:focus {
    border-color: var(--cor-secundaria);
    outline: none;
}

.cards-container {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
    gap: 1.5rem;
}

.product-card {
    background-color: var(--bg-cards);
    border-radius: 15px;
    box-shadow: 0 4px 10px var(--shadow-card);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
}

.card-header h3 {
    margin: 0;
    font-size: 1.25rem;
    color: var(--texto-escuro);
}

.status-badge {
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.85rem;
    text-align: center;
    white-space: nowrap;
    user-select: none;
}

.status-badge.available {
    background-color: var(--cor-secundaria);
    color: #064e3b;
}

.status-badge.unavailable {
    background-color: var(--cor-destaque);
    color: #7f1d1d;
}

.status-badge.unknown {
    background-color: #ccc;
    color: #555;
}

.categories {
    font-size: 0.9rem;
    color: var(--texto-claro);
    margin-bottom: 1rem;
    min-height: 1.2rem;
}

.price {
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 1rem;
    color: var(--texto-escuro);
}

.actions {
    display: flex;
    gap: 0.8rem;
}

.action-btn {
    background-color: var(--cor-primaria);
    color: var(--texto-escuro);
    padding: 0.5rem 0.75rem;
    border-radius: 10px;
    text-decoration: none;
    font-size: 1.1rem;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 2px 5px var(--shadow-card);
    transition: background-color 0.3s ease, color 0.3s ease;
}

.action-btn:hover {
    background-color: var(--cor-secundaria);
    color: #064e3b;
}

.edit-btn {
    background-color: #3b82f6;
    color: #fff;
}

.edit-btn:hover {
    background-color: #2563eb;
}

.delete-btn {
    background-color: #ef4444;
    color: #fff;
}

.delete-btn:hover {
    background-color: #dc2626;
}

.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 2rem;
    gap: 1rem;
    flex-wrap: wrap;
}

.pagination-arrow {
    padding: 0.6rem;
    background-color: var(--cor-primaria);
    border-radius: 50%;
    color: var(--texto-escuro);
    text-decoration: none;
    font-size: 1.1rem;
    box-shadow: 0 2px 5px var(--shadow-card);
    transition: background-color 0.3s ease;
}

.pagination-arrow:hover:not(.disabled) {
    background-color: var(--cor-secundaria);
    color: #064e3b;
}

.pagination-arrow.disabled {
    opacity: 0.5;
    pointer-events: none;
}

.current-page {
    font-weight: 700;
    color: var(--texto-escuro);
    font-size: 1rem;
}

.empty-state {
    text-align: center;
    color: #999;
    margin-top: 3rem;
}

.empty-state i {
    font-size: 3rem;
    margin-bottom: 0.5rem;
}
</style>

<script>
    function filterProducts() {
        const searchTerm = document.getElementById("searchProduct").value.toLowerCase();
        const availability = document.getElementById("adicional-filter").value;
        const products = document.querySelectorAll(".product-card");
        let found = false;

        products.forEach(product => {
            const productName = product.querySelector("h3").textContent.toLowerCase();
            const productAvailability = product.getAttribute("data-adicional").toLowerCase();

            const matchesSearch = productName.includes(searchTerm);
            const matchesAvailability = availability ? productAvailability === availability : true;

            if (matchesSearch && matchesAvailability) {
                product.style.display = "";
                found = true;
            } else {
                product.style.display = "none";
            }
        });

        const noResultsMessage = document.getElementById("noResultsMessage");

        if (!found && (searchTerm || availability)) {
            noResultsMessage.style.display = "block";
        } else {
            noResultsMessage.style.display = "none";
        }
    }
</script>
{% endblock %}
-->
