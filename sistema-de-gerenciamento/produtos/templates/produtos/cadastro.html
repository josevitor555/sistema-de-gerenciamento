<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro de Produto</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    rel="stylesheet"
  />

  <style>
    /* Fundo gradiente rosa e verde claro em toda a tela */
    body {
      margin: 0;
      height: 100vh;
      font-family: "Roboto", Arial, sans-serif;
      background: linear-gradient(135deg, #f8b9c4 0%, #d1f0e3 100%);
      display: flex;
      overflow: hidden;
      color: #333;
      position: relative;
    }

    /* Seta voltar fixa no topo esquerdo da tela */
    .back-button {
      position: fixed;
      top: 10px; /* mais para cima */
      left: 20px;
      font-size: 28px;
      color: #d94f4f;
      font-weight: 700;
      text-decoration: none;
      z-index: 1000;
      opacity: 0; /* invisível por padrão */
      transition: opacity 0.3s ease, color 0.3s ease;
      cursor: pointer;
    }

    .back-button:hover {
      color: #a53636;
      opacity: 1; /* aparece ao passar o mouse */
    }

    /* Container principal dividindo tela em 2 colunas */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* Lado esquerdo: imagem ilustrativa */
    .image-side {
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Estilo do SVG */
    .image-side svg {
      width: 60%;
      height: auto;
      fill: #d94f4f;
      stroke: #a53636;
      stroke-width: 2;
    }

    /* Lado direito: formulário */
    form {
      width: 50%;
      padding: 40px 50px;
      box-sizing: border-box;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: transparent;
      color: #333;
    }

    label {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 6px;
      color: #444;
      display: block;
    }

    .required::after {
      content: " *";
      color: #d94f4f;
      font-weight: 700;
      margin-left: 2px;
    }

    input[type="text"],
    input[type="number"],
    textarea,
    select,
    input[type="file"],
    input[list] {
      width: 100%;
      padding: 12px 14px;
      border: 1.8px solid #d94f4f;
      border-radius: 10px;
      font-size: 15px;
      font-family: "Roboto", Arial, sans-serif;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
      color: #222;
      background: #fff;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus,
    select:focus,
    input[type="file"]:focus,
    input[list]:focus {
      border-color: #a53636;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      font-size: 15px;
    }

    button {
      background-color: #d94f4f;
      color: white;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 10px;
      width: 100%;
    }

    button:hover {
      background-color: #a53636;
    }

    .message {
      font-weight: 700;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }

    .message.error {
      color: #b71c1c;
    }

    .message.success {
      color: #2e7d32;
    }

    /* Scroll só se necessário no form */
    @media (max-width: 900px) {
      body {
        flex-direction: column;
        overflow-y: auto;
      }

      .container {
        flex-direction: column;
        height: auto;
      }

      form,
      .image-side {
        width: 100%;
        padding: 20px;
      }

      .image-side {
        height: 250px;
      }
    }
  </style>
</head>

<body>
  <a href="{% url 'produto_list' %}" class="back-button" title="Voltar">&#8592;</a>

  <div class="container">
    <div class="image-side" aria-label="Imagem ilustrativa de cadastro">
      <!-- SVG personalizado representando cadastro: caixa de produto -->
      <svg
        viewBox="0 0 64 64"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        role="img"
      >
        <rect x="8" y="18" width="48" height="28" rx="4" ry="4" fill="#f8b9c4" />
        <path
          d="M8 18 L32 38 L56 18"
          fill="none"
          stroke="#a53636"
          stroke-width="2"
          stroke-linejoin="round"
        />
        <line x1="20" y1="30" x2="44" y2="30" stroke="#a53636" stroke-width="2" />
        <line x1="32" y1="18" x2="32" y2="46" stroke="#a53636" stroke-width="2" />
      </svg>
    </div>

    <form method="POST" enctype="multipart/form-data" action="{% url 'produto_create' %}">
      {% csrf_token %}

      <label for="nome" class="required">Nome:</label>
      <input type="text" id="nome" name="nome" required />

      <label for="descricao">Descrição:</label>
      <textarea id="descricao" name="descricao"></textarea>

      <label for="marca">Marca:</label>
      <input type="text" id="marca" name="marca" />

      <label for="categoria" class="required">Categoria:</label>
      <input list="categorias" id="categoria" name="categoria" required />
      <datalist id="categorias">
        {% for categoria in categorias %}
        <option value="{{ categoria.nome }}">{{ categoria.nome }}</option>
        {% endfor %}
      </datalist>

      <label for="valor" class="required">Valor:</label>
      <input type="number" step="0.01" id="valor" name="valor" required />

      <label for="adicional" class="required">Adicional:</label>
      <select name="adicional" id="adicional" required>
        <option value="disponivel">Disponível</option>
        <option value="nao_disponivel">Não Disponível</option>
      </select>

      <label for="imagem">Imagem:</label>
      <input type="file" id="imagem" name="imagem" />

      <button type="submit">Cadastrar</button>

      {% if form_submetido and messages %}
      {% for message in messages %}
      <p class="message {% if message.tags == 'error' %}error{% else %}success{% endif %}">
        {{ message }}
      </p>
      {% endfor %}
      {% endif %}
    </form>
  </div>
</body>

</html>
